<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>झटपट</title>

<!-- PWA install support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1035">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="झटपट">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1035;
    --ink-soft:#2E2050;
    --paper:#FFF8ED;
    --marigold:#FFB800;
    --marigold-deep:#FF8A00;
    --coral:#FF5D73;
    --teal:#06B6A4;
    --violet:#8B5CF6;
    --line:rgba(255,255,255,0.09);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 10%, #2E2050 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #1a0f38 0%, transparent 50%),
      var(--ink);
    font-family:'Inter',sans-serif;
    padding:24px 12px;
  }
  .devanagari{font-family:'Noto Sans Devanagari','Baloo 2',sans-serif;}

  /* ---- Phone frame ---- */
  .phone{
    width:100%;
    max-width:390px;
    height:min(844px, 92vh);
    background:var(--paper);
    border-radius:44px;
    border:10px solid #120a26;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 30px 60px -15px rgba(0,0,0,0.6),
      0 0 80px -20px rgba(255,184,0,0.15);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .notch{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:110px; height:22px; background:#120a26; border-radius:14px; z-index:50;
  }

  /* ---- Status bar ---- */
  .statusbar{
    height:46px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; font-size:13px; font-weight:700; color:var(--ink);
    background:var(--paper);
  }

  /* ---- Header ---- */
  .header{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%);
    padding:6px 20px 22px;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:'';
    position:absolute; top:-40px; right:-40px; width:150px; height:150px;
    background:radial-gradient(circle, rgba(255,184,0,0.35), transparent 70%);
    filter:blur(10px);
  }
  .brand-row{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2;}
  .brand{display:flex; align-items:center; gap:10px;}
  .bolt-mark{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(145deg, var(--marigold), var(--marigold-deep));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(255,138,0,0.4);
    flex-shrink:0;
  }
  .bolt-mark svg{width:18px;height:18px;}
  .brand-name{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:22px;
    color:var(--paper); letter-spacing:0.2px;
  }
  .greet{
    color:rgba(255,248,237,0.55); font-size:12px; margin-top:2px; font-weight:500;
  }
  .bell-wrap{
    width:38px; height:38px; border-radius:12px;
    background:rgba(255,255,255,0.06); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative; cursor:pointer;
  }
  .bell-dot{
    position:absolute; top:8px; right:8px; width:7px; height:7px;
    border-radius:50%; background:var(--coral); border:1.5px solid var(--ink-soft);
  }

  .search-pill{
    margin-top:18px; height:42px; border-radius:14px;
    background:rgba(255,255,255,0.07); border:1px solid var(--line);
    display:flex; align-items:center; gap:8px; padding:0 14px;
    position:relative; z-index:2;
  }
  .search-pill span{color:rgba(255,248,237,0.4); font-size:13px; font-weight:500;}

  /* ---- Scroll body ---- */
  .body{
    flex:1; overflow-y:auto; padding:18px 18px 90px;
    background:var(--paper);
  }
  .body::-webkit-scrollbar{display:none;}

  .stories{
    display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px;
  }
  .story{
    flex-shrink:0; width:58px; text-align:center;
  }
  .story-ring{
    width:54px;height:54px;border-radius:50%;
    background:linear-gradient(135deg,var(--marigold),var(--coral));
    padding:2.5px; margin:0 auto 6px;
  }
  .story-ring div{
    width:100%;height:100%;border-radius:50%;
    background:linear-gradient(135deg,#e8dfff,#ffd9dd);
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .story-name{font-size:10px; color:var(--ink); opacity:0.6; font-weight:600;}

  .section-label{
    font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--ink); opacity:0.4; margin:0 0 12px 2px;
  }

  .grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:22px;
  }
  .tile{
    background:#ffffff; border-radius:18px; padding:16px 10px;
    display:flex; flex-direction:column; align-items:center; gap:9px;
    border:1px solid rgba(27,16,53,0.06);
    box-shadow:0 2px 10px rgba(27,16,53,0.04);
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
    text-align:center;
  }
  .tile:active{ transform:scale(0.94); }
  .tile-icon{
    width:46px; height:46px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:21px;
  }
  .tile-label{font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.25;}

  .banner{
    border-radius:20px; padding:20px;
    background:linear-gradient(120deg, var(--teal) 0%, #0891a6 100%);
    color:white; margin-bottom:22px; position:relative; overflow:hidden;
  }
  .banner::after{
    content:'⚡'; position:absolute; right:10px; top:-10px; font-size:90px; opacity:0.15;
  }
  .banner-title{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:17px; margin-bottom:4px;}
  .banner-sub{font-size:12px; opacity:0.85; font-weight:500; max-width:75%;}

  /* ---- Bottom nav ---- */
  .bottomnav{
    position:absolute; bottom:0; left:0; right:0; height:76px;
    background:rgba(255,248,237,0.92);
    backdrop-filter:blur(14px);
    border-top:1px solid rgba(27,16,53,0.08);
    display:flex; align-items:center; justify-content:space-around;
    padding-bottom:14px; z-index:40;
  }
  .navitem{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; color:var(--ink); opacity:0.4; transition:opacity .15s, transform .15s;
    width:56px;
  }
  .navitem.active{ opacity:1; }
  .navitem .ic{ font-size:20px; }
  .navitem span{ font-size:9.5px; font-weight:700; }
  .navitem.active span{ color:var(--marigold-deep); }
  .navitem.active .ic{ transform:translateY(-2px); }
  .fab{
    width:52px; height:52px; border-radius:16px; margin-top:-26px;
    background:linear-gradient(145deg, var(--marigold), var(--coral));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(255,93,115,0.4);
    color:white; font-size:26px; font-weight:400;
    cursor:pointer;
  }

  /* ---- Screen overlay (mock detail screens) ---- */
  .screen{
    position:absolute; inset:0; background:var(--paper);
    transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,0,1);
    z-index:60; display:flex; flex-direction:column;
  }
  .screen.open{ transform:translateY(0); }
  .screen-top{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%);
    padding-top:46px;
    display:flex; align-items:center; gap:12px; padding:56px 18px 18px;
    flex-shrink:0;
  }
  .back-btn{
    width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;color:var(--paper);
    font-size:16px; cursor:pointer; border:1px solid var(--line); flex-shrink:0;
  }
  .screen-top-title{color:var(--paper); font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;}
  .screen-body{ flex:1; overflow-y:auto; padding:22px 20px 40px; }
  .mock-line{ height:12px; border-radius:6px; background:rgba(27,16,53,0.08); margin-bottom:10px; }
  .mock-card{
    background:white; border-radius:16px; padding:16px; margin-bottom:14px;
    border:1px solid rgba(27,16,53,0.06); box-shadow:0 2px 10px rgba(27,16,53,0.04);
  }
  .feature-tag{
    display:inline-block; font-size:11px; font-weight:700; padding:5px 11px;
    border-radius:20px; background:rgba(255,184,0,0.15); color:#B36A00; margin-bottom:14px;
  }
  .placeholder-note{ font-size:12.5px; color:var(--ink); opacity:0.5; line-height:1.6; }

  /* ---- Reels feed (real playable video) ---- */
  .reels-feed{ display:flex; flex-direction:column; gap:16px; }
  .reel{
    position:relative; border-radius:18px; overflow:hidden;
    background:#000; aspect-ratio:9/14;
    box-shadow:0 4px 18px rgba(27,16,53,0.15);
  }
  .reel video{ width:100%; height:100%; object-fit:cover; display:block; }
  .reel-info{
    position:absolute; left:14px; bottom:14px; right:60px;
    color:white; text-shadow:0 1px 6px rgba(0,0,0,0.6);
  }
  .reel-creator{ font-size:13px; font-weight:700; margin-bottom:3px; }
  .reel-caption{ font-size:12px; opacity:0.9; }
  .reel-actions{
    position:absolute; right:12px; bottom:14px;
    display:flex; flex-direction:column; gap:16px; font-size:19px;
  }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="notch"></div>

  <div class="statusbar">
    <span>9:41</span>
    <span>🔋 100%</span>
  </div>

  <div class="header">
    <div class="brand-row">
      <div class="brand">
        <div class="bolt-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="#1B1035"/></svg>
        </div>
        <div>
          <div class="brand-name devanagari">झटपट</div>
        </div>
      </div>
      <div class="bell-wrap" onclick="openScreen('notif')">
        🔔<div class="bell-dot"></div>
      </div>
    </div>
    <div class="greet">नमस्ते, आज क्या करना है?</div>
    <div class="search-pill"><span>🔍</span><span>Search झटपट...</span></div>
  </div>

  <div class="body">
    <div class="stories">
      <div class="story"><div class="story-ring"><div>➕</div></div><div class="story-name">आप</div></div>
      <div class="story"><div class="story-ring"><div>🧑</div></div><div class="story-name">रवि</div></div>
      <div class="story"><div class="story-ring"><div>👩</div></div><div class="story-name">प्रिया</div></div>
      <div class="story"><div class="story-ring"><div>🧑‍🦱</div></div><div class="story-name">अमन</div></div>
      <div class="story"><div class="story-ring"><div>👩‍🦰</div></div><div class="story-name">नेहा</div></div>
    </div>

    <div class="banner" onclick="openScreen('earnings')">
      <div class="banner-title devanagari">आज की कमाई देखें</div>
      <div class="banner-sub">रील्स और शॉप से ₹0.00 अब तक</div>
    </div>

    <div class="section-label devanagari">सभी फीचर्स</div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="bottomnav">
    <div class="navitem active" data-nav="home" onclick="setNav('home')"><div class="ic">🏠</div><span>होम</span></div>
    <div class="navitem" data-nav="video" onclick="openScreen('video')"><div class="ic">🎬</div><span>वीडियो</span></div>
    <div class="fab" onclick="openScreen('studio')">+</div>
    <div class="navitem" data-nav="chat" onclick="openScreen('chat')"><div class="ic">💬</div><span>चैट</span></div>
    <div class="navitem" data-nav="profile" onclick="openScreen('profile')"><div class="ic">👤</div><span>प्रोफाइल</span></div>
  </div>

  <!-- Mock detail screen (shared template, filled by JS) -->
  <div class="screen" id="screen">
    <div class="screen-top">
      <div class="back-btn" onclick="closeScreen()">←</div>
      <div class="screen-top-title devanagari" id="screen-title">फीचर</div>
    </div>
    <div class="screen-body" id="screen-body"></div>
  </div>
</div>

<script>
const FEATURES = [
  { id:'home',    icon:'🏠', label:'होम',                bg:'#FFE8B8', tag:'नेविगेशन', note:'यह आपकी होम स्क्रीन है — स्टोरीज़, कमाई बैनर और सभी फीचर्स का ग्रिड यहीं से शुरू होता है।' },
  { id:'video',   icon:'🎬', label:'वीडियो + एडिटिंग',    bg:'#FFD5DA', tag:'कंटेंट', note:'शॉर्ट वीडियो देखें, रिकॉर्ड करें और बिल्ट-इन एडिटर से ट्रिम, फिल्टर, टेक्स्ट व म्यूज़िक जोड़ें।' },
  { id:'call',    icon:'📞', label:'ऑडियो/वीडियो कॉलिंग', bg:'#D7F5EF', tag:'कम्युनिकेशन', note:'HD ऑडियो और वीडियो कॉल — 1-टू-1 या ग्रुप में, सीधे कॉन्टैक्ट लिस्ट से शुरू करें।' },
  { id:'chat',    icon:'💬', label:'चैटिंग',              bg:'#E3DBFF', tag:'कम्युनिकेशन', note:'टेक्स्ट, वॉइस नोट्स, फोटो-वीडियो शेयरिंग के साथ रियल-टाइम मैसेजिंग।' },
  { id:'contacts',icon:'👥', label:'कॉन्टैक्ट्स',          bg:'#FFE3C7', tag:'नेटवर्क', note:'अपने सभी दोस्तों और परिवार की लिस्ट, सिंक और नए लोगों को खोजें।' },
  { id:'social',  icon:'❤️', label:'लाइक/कमेंट/शेयर',      bg:'#FFDCE1', tag:'सोशल', note:'पोस्ट्स और रील्स पर लाइक, कमेंट करें और दोस्तों के साथ शेयर करें।' },
  { id:'shop',    icon:'🛍️', label:'शॉप',                 bg:'#D8F0FF', tag:'कॉमर्स', note:'प्रोडक्ट्स ब्राउज़ करें, कार्ट में जोड़ें और सीधे ऐप के अंदर से ऑर्डर करें।' },
  { id:'earnings',icon:'💰', label:'कमाई',                bg:'#D9F7DD', tag:'मॉनेटाइज़ेशन', note:'रील्स, शॉप सेल्स और रेफरल से हुई कमाई का पूरा हिसाब यहां दिखेगा।' },
  { id:'studio',  icon:'📸', label:'फोटो/वीडियो स्टूडियो', bg:'#FFEAD1', tag:'क्रिएशन', note:'फिल्टर, स्टिकर, टेक्स्ट और ट्रांज़िशन के साथ प्रोफेशनल-लेवल फोटो-वीडियो बनाएं।' },
  { id:'profile', icon:'👤', label:'प्रोफाइल',             bg:'#E7E1FF', tag:'अकाउंट', note:'अपनी जानकारी, पोस्ट्स, फॉलोअर्स और सेटिंग्स यहां मैनेज करें।' },
  { id:'notif',   icon:'🔔', label:'नोटिफिकेशन',           bg:'#FFE0DC', tag:'अपडेट्स', note:'लाइक्स, मैसेज, कमाई अपडेट्स और फॉलो रिक्वेस्ट की सभी सूचनाएं यहां आएंगी।' },
];

const grid = document.getElementById('grid');
FEATURES.forEach(f=>{
  const el = document.createElement('div');
  el.className='tile';
  el.onclick=()=>openScreen(f.id);
  el.innerHTML = `<div class="tile-icon" style="background:${f.bg}">${f.icon}</div><div class="tile-label devanagari">${f.label}</div>`;
  grid.appendChild(el);
});

function setNav(id){
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active', n.dataset.nav===id));
}

const SAMPLE_VIDEOS = [
  { src:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4', creator:'@नेहा_क्रिएट्स', caption:'शाम की सैर 🌸' },
  { src:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', creator:'@रवि_व्लॉग्स', caption:'कैंपफायर वाइब्स 🔥' },
  { src:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', creator:'@अमन_एनिमेशन', caption:'शॉर्ट फिल्म क्लिप 🎞️' },
];

function openScreen(id){
  const f = FEATURES.find(x=>x.id===id);
  if(!f) return;
  document.getElementById('screen-title').textContent = f.label;

  if(id==='video'){
    document.getElementById('screen-body').innerHTML = `
      <span class="feature-tag devanagari">${f.tag}</span>
      <div class="reels-feed">
        ${SAMPLE_VIDEOS.map((v,i)=>`
          <div class="reel">
            <video src="${v.src}" ${i===0?'autoplay':''} muted loop playsinline controls></video>
            <div class="reel-info">
              <div class="reel-creator devanagari">${v.creator}</div>
              <div class="reel-caption devanagari">${v.caption}</div>
            </div>
            <div class="reel-actions">
              <div>❤️</div><div>💬</div><div>↗️</div>
            </div>
          </div>
        `).join('')}
      </div>
      <p class="placeholder-note devanagari" style="margin-top:6px;">डेमो सैंपल क्लिप्स चल रही हैं — असली ऐप में यूज़र्स के अपलोड किए वीडियो यहां चलेंगे।</p>
    `;
  } else {
    document.getElementById('screen-body').innerHTML = `
      <span class="feature-tag devanagari">${f.tag}</span>
      <div class="mock-card">
        <div class="mock-line" style="width:70%"></div>
        <div class="mock-line" style="width:92%"></div>
        <div class="mock-line" style="width:55%"></div>
      </div>
      <div class="mock-card">
        <div class="mock-line" style="width:80%"></div>
        <div class="mock-line" style="width:40%"></div>
      </div>
      <p class="placeholder-note devanagari">${f.note}</p>
    `;
  }

  document.getElementById('screen').classList.add('open');
  const nav = {video:'video',chat:'chat',profile:'profile'}[id];
  if(nav) setNav(nav);
}
function closeScreen(){
  document.getElementById('screen').classList.remove('open');
  setNav('home');
}

// PWA install prompt handling
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('install-btn');
  if(btn) btn.style.display = 'flex';
});
function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{ deferredPrompt = null; });
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>

<div id="install-btn" onclick="installApp()" style="display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:999;background:linear-gradient(135deg,#FFB800,#FF8A00);color:#1B1035;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;padding:12px 22px;border-radius:30px;box-shadow:0 8px 20px rgba(255,138,0,0.4);align-items:center;gap:8px;cursor:pointer;">
  📲 झटपट इंस्टॉल करें
</div>

</body>
</html>
